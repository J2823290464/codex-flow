[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-flow"
version = "0.1.0"
description = "Feishu-driven Codex workflow for task intake, development, and push automation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]

[project.scripts]
codex-flow = "scripts.feishu_task_runner:main"

[tool.setuptools]
packages = ["scripts"]
